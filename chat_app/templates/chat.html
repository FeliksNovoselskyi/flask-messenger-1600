{% extends "base.html" %}

{% block links %} 
    <link rel="stylesheet" href= "{{ url_for('chat.static', filename='css/style.css')}}">
{% endblock %}

{% block content %}
    <div id = "chat_container">
        {% for chat in chats %}
            <a href="/chat/{{ chat.id }}">{{ chat.title }}</a>
        {% endfor %}
    </div>
    

    <div id='chat-field' class="chat-field">
        <div id="message-container" class="message-container">
        </div>
        <div id='input-container' class="input-container">
            <input id= 'input-field' type="text" placeholder="Введите текст">
            <button id="send-button" type="button">Send</button>
        </div>
    </div>

    <!--🦒🦒🦒Егор. Собрать контейнер под отображение участников чата🦒🦒🦒-->
    <div id="participants-container">
        <h3>Участники чата</h3>
    </div>
    
{% endblock %}

{% block scripts %}
    <script type ="module" src = "{{url_for('chat.static', filename ='js/main.js')}}"></script>
{% endblock %}
