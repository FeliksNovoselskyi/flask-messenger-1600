{% extends "base.html" %}

{% block links %} 
    <link rel="stylesheet" href= "{{ url_for('chat.static', filename='css/style.css')}}">
{% endblock %}

{% block content %}
    <div id = "chat_container">
        {% for chat in chats %}
            <a href="/chat/{{ chat.id }}">{{ chat.title }}</a>
        {% endfor %}
    </div>
    

    <div id='chat-field' class="chat-field">
        {% block messages %}
        {% endblock %}
    </div>

    <div id="participants-container">
        <h3>Участники чата</h3>
        {% block members_block %}
        {% endblock %}
    </div>
    
{% endblock %}

{% block scripts %}
    <script src = "{{url_for('chat.static', filename ='js/config.js')}}"></script>
    <script src = "{{url_for('chat.static', filename ='js/main.js')}}"></script>
    <script src = "{{url_for('chat.static', filename ='js/opened_chat.js')}}"></script>
{% endblock %}
