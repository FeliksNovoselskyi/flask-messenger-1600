{% extends "base.html" %}

{% block links %} 
    <link rel="stylesheet" href= "{{ url_for('chat.static', filename='css/style.css')}}">
{% endblock %}

{% block content %}
<form method="post">

    <input type="text" placeholder="Почта" name= "email" value="{{ email }}">
    <input type="password" placeholder="Введите пароль" name= "password" value="{{ password }}">
    <button type="submit">Ввойти</button>

    <p>{{ error }}</p>

</form>
{% endblock content %}
