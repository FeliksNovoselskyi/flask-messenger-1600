<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ochen krutaya stranica</title>
    <link rel="stylesheet" href= "{{ url_for('static', filename='css/style.css')}}">
    {% block links %} 
    {% endblock %}
</head>
<body>
    <header>
        <a href="/">Головна</a>
        <a href="/reg">Регістрація</a>
        <a href="/auth">Авторизація</a>
        {% if can_logout %}
            <a href="/logout">Вийти</a>
        {% endif %}
    </header>
    
    <main>
        {% block content %} 
        {% endblock %}
    </main>

    <footer>
        {% block footer %} 
        {% endblock %}
    </footer>
    
    <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.4/socket.io.js"></script>
    
    {% block scripts %} 
    {% endblock %}
    
</body>
</html>
